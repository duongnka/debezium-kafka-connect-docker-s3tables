# Default system properties included when running spark-submit.
# This is useful for setting default environmental settings.

#
# Spark Defaults Configuration
# Simplified and structured for Iceberg + MinIO + REST Catalog + Streaming
#

# ─────────────────────────────────────────────────────────────
# Core Spark Configuration
# ─────────────────────────────────────────────────────────────
spark.eventLog.enabled                      true
spark.eventLog.dir                          /home/iceberg/spark-events
spark.history.fs.logDirectory               /home/iceberg/spark-events
spark.sql.catalogImplementation             in-memory

# ─────────────────────────────────────────────────────────────
# Iceberg + REST Catalog (Main Catalog)
# ─────────────────────────────────────────────────────────────
spark.sql.extensions                        org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.rest                      org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.rest.catalog-impl         org.apache.iceberg.rest.RESTCatalog
spark.sql.catalog.rest.uri                  
spark.sql.catalog.rest.warehouse            s3://warehouse/
spark.sql.catalog.rest.io-impl              org.apache.iceberg.aws.s3.S3FileIO
# ─────────────────────────────────────────────────────────────
# MinIO (S3-Compatible) Configuration
# ─────────────────────────────────────────────────────────────
spark.sql.catalog.rest.s3.endpoint          http://minio:9000
spark.sql.catalog.rest.s3.access-key-id     admin
spark.sql.catalog.rest.s3.secret-access-key password
spark.sql.catalog.rest.s3.path-style-access true

# ─────────────────────────────────────────────────────────────
# SQL + Streaming Behavior
# ─────────────────────────────────────────────────────────────
spark.sql.iceberg.handle-timestamp-without-timezone  true
spark.sql.streaming.schemaInference                  true
spark.sql.defaultCatalog                             rest

# ─────────────────────────────────────────────────────────────
# Optional (for easier debugging / interactive use)
# ─────────────────────────────────────────────────────────────
spark.driver.memory                      2g
spark.executor.memory                    2g
spark.ui.prometheus.enabled              true
spark.ui.prometheus.port                 4040

# ─────────────────────────────────────────────────────────────
# Hadoop S3A Support (for Spark checkpoints)
# ─────────────────────────────────────────────────────────────
spark.hadoop.fs.s3a.impl                    org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.access.key              admin
spark.hadoop.fs.s3a.secret.key              password
spark.hadoop.fs.s3a.endpoint                http://minio:9000
spark.hadoop.fs.s3a.path.style.access       true
spark.hadoop.fs.s3a.connection.ssl.enabled  false
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

